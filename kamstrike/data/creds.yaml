    - [admin, "1234"]
    - [guest, guest]
  Foscam:
    - [admin, ""]
    - [admin, admin]
    - [admin, "888888"]
  WIFICAM:
    - [admin, ""]
    - [admin, admin]
    - [admin, "123456"]
  Reolink:
