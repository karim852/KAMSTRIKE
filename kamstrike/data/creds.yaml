# Factory-default credentials shipped by camera / NVR / DVR vendors.
#
# `global` is tried against any device. Vendor blocks are tried only when the
# fingerprint stage identified that vendor, which keeps the spray small enough to
# stay under the account-lockout thresholds most firmware enforces.
#
# Passwords written as "" mean an empty password. Entries are ordered most-likely-first.

global:
  - [admin, admin]
  - [admin, ""]
  - [admin, "12345"]
  - [admin, "123456"]
  - [admin, password]
  - [admin, "1234"]
  - [admin, "admin123"]
  - [admin, "9999"]
  - [admin, "4321"]
  - [root, root]
  - [root, admin]
  - [root, "12345"]
  - [root, pass]
  - [user, user]
  - [guest, guest]
  - [supervisor, supervisor]
  - [operator, operator]
  - ["666666", "666666"]
  - ["888888", "888888"]

vendors:
  Hikvision:
    - [admin, "12345"]
    - [admin, "abc12345"]
    - [admin, admin]
    - [admin, "hik12345"]
    - [admin, "Admin12345"]
    - [operator, "12345"]
  Dahua:
    - [admin, admin]
    - [admin, "admin123"]
    - [admin, "888888"]
    - [888888, "888888"]
    - [666666, "666666"]
    - [default, "tluafed"]
  Axis:
    - [root, pass]
    - [root, root]
    - [root, admin]
    - [root, "12345"]
  Vivotek:
    - [root, ""]
    - [root, root]
    - [admin, admin]
  GeoVision:
    - [admin, admin]
    - [admin, "1234"]
  Xiongmai:
    - [admin, ""]
    - [admin, "tlJwpbo6"]
    - [default, "tluafed"]
    - [root, xc3511]
    - [root, "juantech"]
  TVT:
    - [admin, "123456"]
    - [admin, "admin"]
  TBK:
    - [admin, "admin"]
    - [admin, ""]
    - [admin, "1234"]
  Avtech:
