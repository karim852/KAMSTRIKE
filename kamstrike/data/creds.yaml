# Credentials the Mirai family sprays at telnet/SSH on this class of device.
# Only used when --telnet is requested; telnet logins are slow and noisy.
telnet:
  - [root, xc3511]
  - [root, vizxv]
  - [root, admin]
  - [root, ""]
  - [root, "888888"]
  - [root, juantech]
  - [root, "54321"]
  - [root, anko]
  - [root, zlxx.]
  - [root, "7ujMko0vizxv"]
  - [root, "7ujMko0admin"]
  - [root, system]
  - [root, ikwb]
  - [root, dreambox]
  - [root, hi3518]
  - [root, klv123]
  - [root, "jvbzd"]
  - [admin, admin]
  - [admin, "1111"]
  - [admin, smcadmin]
  - [support, support]
  - [service, service]
  - [supervisor, supervisor]
