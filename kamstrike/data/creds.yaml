    - [admin, admin]
  "D-Link":
    - [admin, ""]
    - [admin, admin]
  NUUO:
    - [admin, admin]
    - [admin, ""]
  Uniview:
    - [admin, "123456"]
    - [admin, admin]
  Hanwha:
    - [admin, "4321"]
    - [admin, admin]
    - [admin, "1111111"]
  Bosch:
    - [service, ""]
    - [srvadmin, ""]
    - [admin, admin]
  Panasonic:
    - [admin, "12345"]
    - [admin, admin]
  Sony:
    - [admin, admin]
    - [admin, ""]
  Mobotix:
    - [admin, meinsm]
  Trendnet:
    - [admin, admin]
    - [admin, ""]
  Vstarcam:
    - [admin, "888888"]
    - [admin, admin]
  Honeywell:
    - [admin, "1234"]
    - [administrator, "1234"]
  Milesight:
    - [admin, "ms1234"]
    - [admin, admin]
  ACTi:
