# KAMSTRIKE vendor fingerprint database.
#
# Each vendor carries weighted rules. A rule kind is one of:
#   server   - substring of the HTTP Server header (case-insensitive)
#   realm    - substring of the WWW-Authenticate realm
#   title    - substring of the HTML <title>
#   body     - substring of a fetched page body
#   header   - "name: substring" against any response header
#   cookie   - substring of a Set-Cookie value
#   path     - probe this path; matches when status is in `status` and all `contains` hit
#   port     - this port being open (weak evidence on its own)
#   rtsp     - substring of the RTSP OPTIONS/DESCRIBE reply
#   onvif    - substring of the ONVIF GetDeviceInformation reply
#
# Scores accumulate; the highest-scoring vendor above `min_score` wins.
min_score: 0.6

vendors:
  - name: Hikvision
    device_types: [camera, nvr, dvr]
    aliases: [hikvision, hik, hiwatch, hilook]
    rules:
      - { kind: server, value: "App-webs", weight: 0.9 }
      - { kind: server, value: "DVRDVS-Webs", weight: 0.95 }
      - { kind: server, value: "DNVRS-Webs", weight: 0.95 }
      - { kind: server, value: "Hikvision", weight: 1.0 }
      - { kind: realm, value: "Hikvision", weight: 0.9 }
      - { kind: body, value: "/doc/page/login.asp", weight: 0.9 }
      - { kind: body, value: "Hikvision", weight: 0.8 }
      - { kind: body, value: "ISAPI", weight: 0.5 }
      - { kind: title, value: "Hikvision", weight: 0.9 }
      - { kind: rtsp, value: "Hikvision", weight: 0.8 }
      - { kind: port, value: "8000", weight: 0.2 }
      - { kind: path, value: "/doc/page/login.asp", status: [200], contains: ["login"], weight: 0.9 }
      - { kind: path, value: "/ISAPI/System/deviceInfo", status: [200, 401], contains: [], weight: 0.7 }
      - { kind: path, value: "/SDK/webLanguage", status: [200, 400, 401, 500], contains: [], weight: 0.3 }

  - name: Dahua
    device_types: [camera, nvr, dvr]
    aliases: [dahua, amcrest, lorex, intelbras, imou, "dh-"]
    rules:
      - { kind: title, value: "WEB SERVICE", weight: 0.9 }
      - { kind: body, value: "/js/merge.js", weight: 0.7 }
      - { kind: body, value: "RPC2_Login", weight: 0.9 }
      - { kind: body, value: "dahua", weight: 0.9 }
      - { kind: cookie, value: "DHLangCookie", weight: 0.9 }
      - { kind: realm, value: "Login to ", weight: 0.4 }
      - { kind: port, value: "37777", weight: 0.7 }
      - { kind: onvif, value: "Dahua", weight: 1.0 }
      - { kind: path, value: "/RPC2_Login", status: [200, 400, 405], contains: [], weight: 0.6 }
      - { kind: path, value: "/current_config/Account1", status: [200], contains: [], weight: 0.8 }

  - name: Axis
    device_types: [camera, encoder]
    aliases: [axis, "axis communications"]
    rules:
      - { kind: realm, value: "AXIS_", weight: 1.0 }
      - { kind: server, value: "Axis", weight: 0.95 }
      - { kind: body, value: "axis-cgi", weight: 0.9 }
      - { kind: title, value: "AXIS", weight: 0.9 }
      - { kind: onvif, value: "AXIS", weight: 1.0 }
      - { kind: path, value: "/axis-cgi/param.cgi", status: [200, 401], contains: [], weight: 0.85 }

  - name: Vivotek
    device_types: [camera, nvr]
    aliases: [vivotek, vvtk]
    rules:
