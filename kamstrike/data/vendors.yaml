# Generic web stacks. Low weight on their own but they unlock stack-level checks
# (GoAhead LD_PRELOAD, Boa traversal) regardless of who badged the plastic.
stacks:
  - { name: GoAhead, kind: server, value: "GoAhead", cves: ["CVE-2017-17562"] }
  - { name: Boa, kind: server, value: "Boa/", cves: ["CVE-2017-9833"] }
  - { name: uc-httpd, kind: server, value: "uc-httpd", cves: ["CVE-2018-10088"] }
  - { name: thttpd, kind: server, value: "thttpd", cves: [] }
  - { name: lighttpd, kind: server, value: "lighttpd", cves: [] }
  - { name: Hipcam, kind: server, value: "Hipcam", cves: [] }
  - { name: Router Webs, kind: server, value: "Router Webs", cves: [] }
