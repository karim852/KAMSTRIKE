id: xiongmai-uc-httpd-exposure

info:
  name: Xiongmai uc-httpd 1.0.0 - Vulnerable Embedded Web Server
  author: kamstrike
  severity: high
  description: |
    uc-httpd 1.0.0 is the embedded web server on the Xiongmai OEM platform that sits behind a
    very large number of white-label recorders and cameras. The build is affected by a stack
    buffer overflow (CVE-2018-10088) and the platform ships undocumented services and a
    blank-password administrator. These devices generally receive no security firmware.
  remediation: Replace the device; this platform is not maintainable.
  reference:
    - https://nvd.nist.gov/vuln/detail/CVE-2018-10088
    - https://nvd.nist.gov/vuln/detail/CVE-2017-16725
  classification:
    cve-id: CVE-2018-10088
    cwe-id: CWE-787
  metadata:
    verified: true
    vendor: xiongmai
  tags: xiongmai,dvr,nvr,camera,buffer-overflow,tech,kamstrike

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
    matchers:
      - type: word
        part: header
        words:
          - "uc-httpd"
    extractors:
      - type: regex
        name: version
        part: header
        group: 1
        regex:
          - "uc-httpd\\s*/?\\s*([0-9.]+)"
